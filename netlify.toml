[build]
  publish = "Website Desing"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Removed forced /start -> /start/ redirect (commit 50f6d90).
# Netlify Pretty URLs handles trailing-slash canonicalisation natively
# when start/index.html exists. The previous rule with force=true created
# an infinite 301 loop on /start/.
