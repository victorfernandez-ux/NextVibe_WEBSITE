<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Page Not Found | NextVibe AI</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            color: #fff;
            letter-spacing: -0.03em;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        a { color: inherit; text-decoration: none; }

        header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(20px);
            border-bottom: 1px solid #1a1a1a;
        }
        .header-inner {
            display: flex; align-items: center; justify-content: space-between;
            max-width: 1200px; margin: 0 auto; padding: 16px 24px;
        }
        .logo { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.04em; }
        .logo span { color: #06B6D4; }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 24px 80px;
            text-align: center;
        }
        .error-code {
            font-size: clamp(5rem, 15vw, 10rem);
            font-weight: 800;
            color: #06B6D4;
            letter-spacing: -0.06em;
            line-height: 1;
            margin-bottom: 16px;
        }
        h1 {
            font-size: clamp(1.4rem, 3vw, 2rem);
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.04em;
        }
        p { color: #9CA3AF; max-width: 400px; margin: 0 auto 40px; }
        .actions { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 12px 28px; font-size: 0.9rem; font-weight: 600;
            border-radius: 6px; transition: all 0.2s; cursor: pointer;
            border: none; font-family: 'Inter', sans-serif; letter-spacing: -0.03em;
        }
        .btn-primary { background: #06B6D4; color: #000; }
        .btn-primary:hover { background: #22D3EE; }
        .btn-outline { background: transparent; color: #fff; border: 1px solid #333; }
        .btn-outline:hover { border-color: #06B6D4; color: #06B6D4; }

        footer {
            padding: 24px;
            text-align: center;
            border-top: 1px solid #1a1a1a;
            font-size: 0.8rem;
            color: #555;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="/" class="logo">Next<span>Vibe</span> AI</a>
        </div>
    </header>

    <main>
        <div>
            <div class="error-code">404</div>
            <h1>Page not found</h1>
            <p>That page doesn't exist. Try the homepage or see what I build.</p>
            <div class="actions">
                <a href="/" class="btn btn-primary">Go Home</a>
                <a href="/services.html" class="btn btn-outline">See Services</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 NextVibe AI</p>
    </footer>
</body>
</html>
